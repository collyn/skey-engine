[package]
name = "skey-engine"
version = "0.1.18"
edition = "2021"
description = "Stateless Vietnamese input method engine"
authors = ["Nguyễn Tiến Huy <collyn094@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/collyn/skey-engine"
readme = "README.md"
keywords = ["vietnamese", "ime", "telex", "vni", "input-method"]
categories = ["text-processing", "internationalization"]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine_bench"
harness = false
